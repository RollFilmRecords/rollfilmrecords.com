<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roll Film Records · Coming soon</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
#anim{position:fixed;z-index:1;pointer-events:none}
@media (prefers-reduced-motion:reduce){#anim{display:none}}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0d1626 url(sea.jpg) 80% center/cover no-repeat fixed}
#line{position:fixed;z-index:4;margin:0;font-family:'Special Elite',monospace;font-weight:400;color:#fff;font-size:13px;letter-spacing:.12em;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.85);transform:translate(-50%,-50%)}
#line .sep{opacity:.6;margin:0 .6em}
#chest{position:fixed;z-index:5;border-radius:6px;box-shadow:0 0 12px 3px rgba(169,211,232,.7),inset 0 0 0 1px rgba(169,211,232,.75);transition:box-shadow .3s,background .3s}
#chest:hover,#chest:focus-visible{background:rgba(169,211,232,.15);box-shadow:0 0 22px 6px rgba(169,211,232,.7),inset 0 0 0 1px rgba(169,211,232,.8);outline:none}
#chest span{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);white-space:nowrap;font:12px 'Special Elite',monospace;background:rgba(13,22,38,.85);color:#a9d3e8;padding:.15rem .5rem;border-radius:3px;opacity:0;transition:opacity .3s;pointer-events:none}
#chest:hover span,#chest:focus-visible span{opacity:1}
@media (max-aspect-ratio:1/1){
body{background-position:85% center}
#line{font-size:10.5px;letter-spacing:.04em;white-space:normal;line-height:1.5;transform:translate(0,-50%)}
#line .sep{display:none}
#line span{display:block}
}
</style></head><body>
<svg id="anim" aria-hidden="true" viewBox="0 0 1280 720" preserveAspectRatio="none">
<defs>
<clipPath id="sky"><rect x="0" y="0" width="1280" height="417"/></clipPath>
<clipPath id="sea"><rect x="0" y="413" width="1280" height="307"/></clipPath>
<filter id="waves" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.006 0.035" numOctaves="2" seed="3" result="n">
<animate attributeName="baseFrequency" dur="12s" values="0.006 0.035;0.0075 0.041;0.006 0.035" repeatCount="indefinite"/>
</feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="feather"><feGaussianBlur stdDeviation="10"/></filter>
<mask id="figMask"><rect x="905" y="285" width="200" height="340" rx="40" fill="#fff" filter="url(#feather)"/></mask>
</defs>
<g clip-path="url(#sky)"><image href="sea.jpg" x="-20" y="0" width="1320" height="720" preserveAspectRatio="none">
<animateTransform attributeName="transform" type="translate" dur="30s" values="-18 0;18 0;-18 0" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/></image></g>
<g clip-path="url(#sea)"><image href="sea.jpg" x="0" y="0" width="1280" height="720" filter="url(#waves)"/></g>
<image href="sea.jpg" x="0" y="0" width="1280" height="720" mask="url(#figMask)"/>
</svg>
<h1 id="line"><span>Roll Film Records</span><b class="sep">·</b><span>coming soon</span><b class="sep">·</b><span>Tapes · Studio · Otherness</span></h1>
<a id="chest" href="https://rollfilmrecords.bandcamp.com" target="_blank" rel="noopener" aria-label="Listen on Bandcamp" title="Listen on Bandcamp"><span>Listen on Bandcamp</span></a>
<script>
(function(){var IW=1280,IH=720,X1=922,Y1=558,X2=1052,Y2=612,HZ=415,MONKEY_L=945,a=document.getElementById('chest'),t=document.getElementById('line');
function place(){var W=innerWidth,H=innerHeight,s=Math.max(W/IW,H/IH),px=parseFloat(getComputedStyle(document.body).backgroundPositionX)/100;
var ox=(W-IW*s)*px,oy=(H-IH*s)*.5;
var v=document.getElementById('anim');v.style.left=ox+'px';v.style.top=oy+'px';v.style.width=IW*s+'px';v.style.height=IH*s+'px';
a.style.left=ox+X1*s+'px';a.style.top=oy+Y1*s+'px';a.style.width=(X2-X1)*s+'px';a.style.height=(Y2-Y1)*s+'px';
var ml=ox+MONKEY_L*s;t.style.top=oy+HZ*s+'px';
if(W>H){t.style.left=Math.min(W/2,(ml-20)/2)+'px';}else{t.style.left='12px';}}
place();addEventListener('resize',place);document.fonts&&document.fonts.ready.then(place);})();
</script>
</body></html>
